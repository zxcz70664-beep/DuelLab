name: DuelLab checks
on:
  push:
    branches: [main, singleplayer-v0.2]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check public/app.js
      - run: npm test
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and import card catalog
        run: docker build --tag duellab:test .
